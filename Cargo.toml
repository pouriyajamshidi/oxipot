[package]
name = "oxipot"
description = "Network honeypot to catch IT, OT, and IoT bots"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Pouriya Jamshidi"]
repository = "https://github.com/pouriyajamshidi/oxipot"
readme = "README.md"
keywords = ["honeypot", "network", "IT", "OT", "IoT"]
license = "Boost Software License"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.4"
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "json",
] }
